name: Temporary TTS cheat sheet

on:
  push:
    branches:
      - 'tmp/tts-shpargalka-20260819'
    paths:
      - '.github/workflows/tmp-tts-shpargalka.yml'
      - 'tts_tmp/**'

jobs:
  build-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install 'piper-tts==1.6.0' faster-whisper

      - name: Download Russian neural voices
        run: |
          mkdir -p voices
          python -m piper.download_voices --download-dir voices ru_RU-dmitri-medium ru_RU-denis-medium ru_RU-irina-medium
          ls -lh voices

      - name: Learn best readable settings and generate all 281 Q&A
        run: python tts_tmp/generate_audio.py

      - name: Validate outputs
        run: |
          test -s 'tts_result/Шпаргалка_3_группа_281_вопрос_ответ.mp3'
          test -s tts_result/verification_report.txt
          ffmpeg -v error -i 'tts_result/Шпаргалка_3_группа_281_вопрос_ответ.mp3' -f null -
          cat tts_result/verification_report.txt
          ls -lh tts_result

      - name: Upload verified audio
        uses: actions/upload-artifact@v4
        with:
          name: shpargalka-audio
          path: |
            tts_result/Шпаргалка_3_группа_281_вопрос_ответ.mp3
            tts_result/verification_report.txt
            tts_result/контрольный_фрагмент.wav
          if-no-files-found: error
          retention-days: 1
