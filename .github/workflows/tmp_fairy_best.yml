name: Temporary Fairy Tale Best MP3

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          pip install -q edge-tts numpy faster-whisper
      - name: Render best version
        run: |
          sed -i "s/threshold_db=-50.0/threshold_db=-65.0/; s/dur <= 0.90/dur <= 1.00/; s/int(0.22\*sr)/int(0.35*sr)/g; s/'threshold_db': -50.0/'threshold_db': -65.0/" tmp_tts_fairy_best/render_best.py
          python tmp_tts_fairy_best/render_best.py
      - name: QA
        run: |
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          from difflib import SequenceMatcher
          from faster_whisper import WhisperModel
          r=Path('tmp_tts_fairy_best'); a=r/'Сказка_о_Бабочке_ЖИВАЯ_версия.mp3'
          p=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,size,format_name','-of','json',str(a)],text=True))['format']
          pauses=json.loads((r/'pause_report.json').read_text(encoding='utf-8'))
          m=WhisperModel('small',device='cpu',compute_type='int8')
          segs,_=m.transcribe(str(a),language='ru',beam_size=5,vad_filter=True)
          tr=' '.join(x.text.strip() for x in segs)
          (r/'asr_transcript.txt').write_text(tr,encoding='utf-8')
          def n(x):
            x=x.lower().replace('ё','е'); x=re.sub(r'[^а-я0-9]+',' ',x); return re.sub(r'\s+',' ',x).strip()
          ratio=SequenceMatcher(None,n((r/'source_spoken.txt').read_text(encoding='utf-8')),n(tr)).ratio()
          rep={'duration_seconds':round(float(p['duration']),2),'size_bytes':int(p['size']),'format':p.get('format_name'),'asr_similarity':round(ratio,4),'max_true_silence_seconds':pauses['max_silence_after_seconds'],'removed_true_silence_seconds':pauses['removed_silence_seconds'],'roles':'Svetlana narrator/butterfly/dragonfly with distinct prosody; Dmitry as Old Burdock','background':'dynamic meadow + stream + insects + sparse birds, sidechain-ducked under speech'}
          (r/'qa_report.json').write_text(json.dumps(rep,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rep,ensure_ascii=False,indent=2))
          if ratio<.90: raise SystemExit(f'ASR similarity too low {ratio:.3f}')
          if pauses['max_silence_after_seconds']>1.0: raise SystemExit('true silence >1 sec')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fairy-tale-best-mp3
          path: |
            tmp_tts_fairy_best/Сказка_о_Бабочке_ЖИВАЯ_версия.mp3
            tmp_tts_fairy_best/qa_report.json
            tmp_tts_fairy_best/asr_transcript.txt
            tmp_tts_fairy_best/pause_report.json
          retention-days: 1
