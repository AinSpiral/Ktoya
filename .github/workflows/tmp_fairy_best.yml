name: Temporary Fairy Tale Best MP3

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          pip install -q edge-tts numpy faster-whisper
      - name: Render
        run: |
          python - <<'PY'
          import asyncio,json,subprocess,wave
          from pathlib import Path
          import numpy as np, edge_tts
          root=Path('tmp_tts_fairy_best'); segs=json.loads((root/'story_segments.json').read_text(encoding='utf-8'))
          cfg={'narrator':('ru-RU-SvetlanaNeural','-3%','-2Hz'),'butterfly':('ru-RU-SvetlanaNeural','+5%','+14Hz'),'dragonfly':('ru-RU-SvetlanaNeural','-7%','-8Hz'),'burdock':('ru-RU-DmitryNeural','-8%','-12Hz')}
          async def main():
            for i,s in enumerate(segs):
              v,r,p=cfg[s['role']]
              mp3=root/f'seg_{i:03d}.mp3'; wav=root/f'seg_{i:03d}.wav'
              await edge_tts.Communicate(s['text'],voice=v,rate=r,pitch=p).save(str(mp3))
              subprocess.run(['ffmpeg','-loglevel','error','-y','-i',str(mp3),'-ar','44100','-ac','1','-c:a','pcm_s16le',str(wav)],check=True)
          asyncio.run(main())
          parts=[]
          for i,s in enumerate(segs):
            pause=0.55 if i==0 else (0.42 if s['text'].endswith('...') else (0.32 if s['role']=='narrator' else (0.22 if len(s['text'])<18 else 0.26)))
            sil=root/f'sil_{i:03d}.wav'
            subprocess.run(['ffmpeg','-loglevel','error','-y','-f','lavfi','-i','anullsrc=r=44100:cl=mono','-t',str(pause),str(sil)],check=True)
            parts += [root/f'seg_{i:03d}.wav', sil]
          (root/'concat.txt').write_text('\n'.join(f"file '{p.name}'" for p in parts),encoding='utf-8')
          subprocess.run(['ffmpeg','-loglevel','error','-y','-f','concat','-safe','0','-i','concat.txt','-c:a','pcm_s16le','voice.wav'],check=True,cwd=root)
          for name,d in [('head.wav',0.65),('tail.wav',0.75)]:
            subprocess.run(['ffmpeg','-loglevel','error','-y','-f','lavfi','-i','anullsrc=r=44100:cl=mono','-t',str(d),str(root/name)],check=True)
          (root/'voice_concat.txt').write_text("file 'head.wav'\nfile 'voice.wav'\nfile 'tail.wav'\n",encoding='utf-8')
          subprocess.run(['ffmpeg','-loglevel','error','-y','-f','concat','-safe','0','-i','voice_concat.txt','-c:a','pcm_s16le','voice_full.wav'],check=True,cwd=root)
          dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(root/'voice_full.wav')],text=True)); sr=44100; n=int(dur*sr); rng=np.random.default_rng(21); t=np.arange(n)/sr
          breeze=np.convolve(rng.normal(0,1,n),np.ones(1600)/1600,mode='same')*0.16
          water=np.convolve(rng.normal(0,1,n),np.ones(24)/24,mode='same')*0.045
          insects=(np.sin(2*np.pi*6200*t+0.7*np.sin(2*np.pi*0.17*t))+0.35*np.sin(2*np.pi*7800*t))*0.0022
          amb=breeze+water+insects
          for sec in [4.5,18,36,58,83,110,139,166]:
            if sec+.5>=dur: continue
            L=int(.45*sr); x=np.arange(L)/sr; f=1900+300*np.sin(2*np.pi*x/.45); ph=2*np.pi*np.cumsum(f)/sr; a=int(sec*sr); amb[a:a+L]+=np.sin(ph)*np.hanning(L)*0.028
          start=max(0,dur-22); a=int(start*sr); L=min(int(6*sr),n-a); x=np.arange(L)/sr; amb[a:a+L]+=(np.sin(2*np.pi*880*x)+.45*np.sin(2*np.pi*1320*x))*np.exp(-x/4)*0.004
          with wave.open(str(root/'ambience.wav'),'wb') as w:
            w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr);w.writeframes((np.clip(np.tanh(amb),-1,1)*32767).astype('<i2').tobytes())
          filt='[0:a]loudnorm=I=-16:TP=-1.5:LRA=8,asplit=2[v1][v2];[1:a]highpass=f=90,lowpass=f=10500,volume=0.32[bg];[bg][v1]sidechaincompress=threshold=0.018:ratio=9:attack=18:release=420[duck];[v2][duck]amix=inputs=2:duration=first:weights=1 0.30:normalize=0,alimiter=limit=0.95[out]'
          subprocess.run(['ffmpeg','-loglevel','error','-y','-i',str(root/'voice_full.wav'),'-i',str(root/'ambience.wav'),'-filter_complex',filt,'-map','[out]','-ar','44100','-ac','2','-c:a','libmp3lame','-b:a','160k',str(root/'Сказка_о_Бабочке_ЖИВАЯ_версия.mp3')],check=True)
          (root/'source_spoken.txt').write_text(' '.join(s['text'] for s in segs),encoding='utf-8')
          PY
      - name: QA
        run: |
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          from difflib import SequenceMatcher
          from faster_whisper import WhisperModel
          r=Path('tmp_tts_fairy_best'); a=r/'Сказка_о_Бабочке_ЖИВАЯ_версия.mp3'
          p=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,size,format_name','-of','json',str(a)],text=True))['format']
          m=WhisperModel('small',device='cpu',compute_type='int8'); segs,_=m.transcribe(str(a),language='ru',beam_size=5,vad_filter=True); tr=' '.join(x.text.strip() for x in segs); (r/'asr_transcript.txt').write_text(tr,encoding='utf-8')
          def n(x): x=x.lower().replace('ё','е'); x=re.sub(r'[^а-я0-9]+',' ',x); return re.sub(r'\s+',' ',x).strip()
          ratio=SequenceMatcher(None,n((r/'source_spoken.txt').read_text(encoding='utf-8')),n(tr)).ratio()
          s=subprocess.run(['ffmpeg','-hide_banner','-i',str(a),'-af','silencedetect=noise=-48dB:d=1.01','-f','null','-'],capture_output=True,text=True); long=[x for x in s.stderr.splitlines() if 'silence_duration:' in x]
          rep={'duration_seconds':round(float(p['duration']),2),'size_bytes':int(p['size']),'format':p.get('format_name'),'asr_similarity':round(ratio,4),'hard_silence_events_over_1s':len(long),'roles':'Svetlana narrator/butterfly/dragonfly with distinct prosody; Dmitry as Old Burdock','background':'dynamic meadow + stream + insects + sparse birds, ducked under speech'}; (r/'qa_report.json').write_text(json.dumps(rep,ensure_ascii=False,indent=2),encoding='utf-8'); print(json.dumps(rep,ensure_ascii=False,indent=2))
          if ratio<.88: raise SystemExit(f'ASR similarity too low {ratio:.3f}')
          if long: raise SystemExit('hard silence >1 sec')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fairy-tale-best-mp3
          path: |
            tmp_tts_fairy_best/Сказка_о_Бабочке_ЖИВАЯ_версия.mp3
            tmp_tts_fairy_best/qa_report.json
            tmp_tts_fairy_best/asr_transcript.txt
          retention-days: 1
